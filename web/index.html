<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente · Registro como Proveedor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1d2330; --mut:#6b7280; --pri:#1f4fd1; --ok:#127a3e; --err:#b42318; --warn:#b54708; --warnbg:#fff7e6; --bd:#e3e6eb }
  * { box-sizing: border-box }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--tx); display:flex; flex-direction:column; height:100vh }
  header { padding:12px 20px; background:var(--card); border-bottom:1px solid var(--bd); display:flex; gap:12px; align-items:center }
  header h1 { font-size:16px; margin:0; flex:1 }
  header small { color:var(--mut) }
  button { font:inherit; border:1px solid var(--bd); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer }
  button.pri { background:var(--pri); color:#fff; border-color:var(--pri) }
  button:disabled { opacity:.5; cursor:default }
  main { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:900px; width:100%; margin:0 auto }
  .msg { padding:12px 16px; border-radius:12px; max-width:85%; background:var(--card); border:1px solid var(--bd) }
  .user { align-self:flex-end; background:var(--pri); color:#fff; border:none; white-space:pre-wrap }
  .bot.confirm { border:2px solid var(--warn); background:var(--warnbg) }
  .bot.error { border-color:var(--err) }
  .badge { display:inline-block; font-size:12px; font-weight:600; color:var(--warn); margin-bottom:6px }
  details.tool { font-size:13px; border:1px solid var(--bd); border-radius:8px; padding:6px 10px; margin:4px 0; background:#fafbfc }
  details.tool summary { cursor:pointer; font-family:ui-monospace, monospace }
  details.tool pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font-size:12px }
  .ok { color:var(--ok) } .ko { color:var(--err) }
  .bot table { border-collapse:collapse; margin:6px 0 } .bot td, .bot th { border:1px solid var(--bd); padding:2px 8px }
  .bot code { background:#eef1f5; padding:1px 4px; border-radius:4px; font-size:13px }
  .bot h3, .bot h4 { margin:8px 0 4px; font-size:15px } .bot ul { margin:4px 0; padding-left:20px } .bot p { margin:4px 0 }
  .thinking { color:var(--mut); font-style:italic }
  .quick { display:flex; gap:8px; margin-top:8px }
  footer { padding:12px 20px; background:var(--card); border-top:1px solid var(--bd) }
  form { display:flex; gap:8px; max-width:900px; margin:0 auto }
  textarea { flex:1; font:inherit; padding:10px; border:1px solid var(--bd); border-radius:8px; resize:none; height:56px }
  .ejemplos { max-width:900px; margin:0 auto 8px; display:flex; gap:6px; flex-wrap:wrap } .ejemplos button { font-size:12px; padding:3px 8px }
</style>
</head>
<body>
<header>
  <h1>Agente · Registro como Proveedor <small id="modelo"></small></h1>
  <button id="nueva" title="Empieza una conversación nueva">Nueva sesión</button>
</header>
<main id="chat" aria-live="polite"></main>
<footer>
  <div class="ejemplos" id="ejemplos"></div>
  <form id="form">
    <label for="entrada" hidden>Mensaje</label>
    <textarea id="entrada" placeholder='Ej.: Procesa el caso "ec-corp-andina"' autofocus></textarea>
    <button class="pri" id="enviar">Enviar</button>
  </form>
</footer>
<script>
const $ = (s) => document.querySelector(s)
const chat = $("#chat"), entrada = $("#entrada"), enviar = $("#enviar")
const EJEMPLOS = [
  'Procesa el caso "ec-corp-andina". Dime qué campos quedaron llenos, cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.',
  'Procesa el caso "co-industrias-delta"',
  'Procesa el caso "hn-agroexport-sula"',
  'Procesa el caso "pe-inexistente"',
]
let sesion = localStorage.getItem("sesion") || nuevaId()
let clave = localStorage.getItem("clave") || ""

function nuevaId() { const id = crypto.randomUUID(); localStorage.setItem("sesion", id); return id }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c])
const enlaces = (h) => h.replace(/(?<![\w/])(out\/[\w\-./]+\.(?:xlsx|pdf|md|jsonl|json|txt))/g, (r) => `<a href="/${r}${clave ? `?k=${encodeURIComponent(clave)}` : ""}" target="_blank">${r}</a>`)

/** Markdown mínimo: encabezados, negrita, código, listas, tablas y párrafos. */
function md(t) {
  const inline = (s) => enlaces(esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>"))
  const out = []; let lista = false, tabla = false
  for (const l of t.split("\n")) {
    const cerrar = () => { if (lista) out.push("</ul>"), lista = false; if (tabla) out.push("</table>"), tabla = false }
    if (/^\s*[-*] /.test(l)) { if (tabla) out.push("</table>"), tabla = false; if (!lista) out.push("<ul>"), lista = true; out.push(`<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`) }
    else if (/^\|.*\|$/.test(l.trim())) { if (/^\|[\s:|-]+\|$/.test(l.trim())) continue; if (!tabla) out.push("<table>"), tabla = true; out.push("<tr>" + l.trim().slice(1, -1).split("|").map((c) => `<td>${inline(c.trim())}</td>`).join("") + "</tr>") }
    else if (/^#{1,4} /.test(l)) { cerrar(); out.push(`<h4>${inline(l.replace(/^#+ /, ""))}</h4>`) }
    else { cerrar(); if (l.trim()) out.push(`<p>${inline(l)}</p>`) }
  }
  if (lista) out.push("</ul>"); if (tabla) out.push("</table>")
  return out.join("")
}

function burbuja(cls, html) { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; chat.append(d); chat.scrollTop = chat.scrollHeight; return d }

function herramientas(calls) {
  return calls.map((c) => `<details class="tool"><summary><span class="${c.ok ? "ok" : "ko"}">${c.ok ? "✓" : "✗"}</span> ${esc(c.nombre)}</summary>
    <pre><b>args</b> ${esc(JSON.stringify(c.args, null, 1))}</pre><pre><b>resultado</b> ${enlaces(esc(c.resumen))}</pre></details>`).join("")
}

function respuesta(r) {
  const cls = "bot" + (r.needsConfirmation ? " confirm" : "") + (r.error ? " error" : "")
  const d = burbuja(cls, (r.needsConfirmation ? `<div class="badge">⚠ El agente necesita tu confirmación</div>` : "") + herramientas(r.toolCalls || []) + md(r.reply || ""))
  if (r.needsConfirmation) {
    const q = document.createElement("div"); q.className = "quick"
    q.innerHTML = `<button class="pri">Sí, confirmo el envío</button><button>No, todavía no</button>`
    const [si, no] = q.querySelectorAll("button")
    si.onclick = () => mandar("Sí, confirmo. Envía el paquete.")
    no.onclick = () => mandar("No envíes todavía.")
    d.append(q)
  }
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-access-key": clave, ...(opts.headers || {}) } })
  if (res.status === 401) { clave = prompt("Clave de acceso al agente:") || ""; localStorage.setItem("clave", clave); return api(path, opts) }
  return res.json()
}

async function mandar(texto) {
  texto = texto.trim(); if (!texto || enviar.disabled) return
  document.querySelectorAll(".quick").forEach((q) => q.remove())
  burbuja("user", esc(texto)); entrada.value = ""; enviar.disabled = true
  const pensando = burbuja("bot thinking", "Pensando y ejecutando herramientas…")
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ sessionId: sesion, message: texto }) })
    pensando.remove()
    respuesta(r.error && !r.reply ? { reply: r.error, error: true } : r)
  } catch {
    pensando.remove(); respuesta({ reply: "No pude contactar al servidor. Revisa tu conexión e inténtalo de nuevo.", error: true })
  } finally { enviar.disabled = false; entrada.focus() }
}

async function cargar() {
  fetch("/api/health").then((r) => r.json()).then((h) => ($("#modelo").textContent = `· ${h.provider}/${h.model}`)).catch(() => {})
  const hist = await api(`/api/sessions/${sesion}`)
  chat.innerHTML = ""
  if (!hist.length) burbuja("bot", md("Hola. Soy el agente de **registro como proveedor**. Dime qué caso procesar, por ejemplo `ec-corp-andina`. Preparo el formulario y el paquete para firma; nunca envío nada sin tu confirmación."))
  for (const m of hist) m.rol === "user" ? burbuja("user", esc(m.texto)) : respuesta(m)
  document.querySelectorAll(".quick").forEach((q, i, all) => i < all.length - 1 && q.remove())
}

EJEMPLOS.forEach((e) => { const b = document.createElement("button"); b.type = "button"; b.textContent = e.length > 50 ? e.slice(0, 50) + "…" : e; b.title = e; b.onclick = () => (entrada.value = e, entrada.focus()); $("#ejemplos").append(b) })
$("#form").onsubmit = (e) => { e.preventDefault(); mandar(entrada.value) }
entrada.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(entrada.value) } }
$("#nueva").onclick = () => { sesion = nuevaId(); cargar() }
cargar()
</script>
</body>
</html>
