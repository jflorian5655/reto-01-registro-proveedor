services:
  - type: web
    name: reto-01-registro-proveedor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "400000"
